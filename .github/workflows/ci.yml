name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ends of the range declared in pyproject.toml (requires-python >=3.9)
        # plus one in the middle.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - run: pytest -q

  # The Finder droplet, which pytest cannot reach: it is AppleScript, and the
  # thing worth guarding is that it gathers a multi-file selection instead of
  # acting on each `odoc` event as it arrives. LaunchServices splits such a
  # selection across several events ~25ms apart, and a droplet that does not
  # wait joins a sheet silently missing its top section. build-app.sh compiles
  # the script and exercises that coalescing directly, so running the build
  # here is the regression test.
  droplet:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the droplet and run its self-tests
        run: contrib/macos/build-app.sh "$RUNNER_TEMP/Join Contact Sheet Scans.app"

  # The single required status check on main. Branch protection matches checks
  # by name, so requiring the matrix jobs directly ("test (3.9)" …) would wedge
  # every PR the moment the matrix changed: the old names stop reporting, and a
  # required check that never arrives blocks forever. Requiring only this job
  # keeps the matrix free to change.
  #
  # if: always() is load-bearing. Without it this job is skipped when something
  # it needs fails, a skipped required check never reports, and PRs hang instead
  # of showing a red X.
  ci-ok:
    if: always()
    needs: [test, droplet]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job above succeeded
        run: |
          echo "test:    ${{ needs.test.result }}"
          echo "droplet: ${{ needs.droplet.result }}"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.droplet.result }}" = "success"
