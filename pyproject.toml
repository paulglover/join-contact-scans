[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joincontactscans"
version = "0.3.0"
description = "Join the sections of a scanned contact sheet into one linear DNG"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paul Glover" }]
dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.7.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
joincontactscans = "joincontactscans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
